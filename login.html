<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Formação Profissional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --light-color: #ecf0f1;
            --dark-color: #2c3e50;
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --danger-color: #c0392b;
        }
        
        body {
            background-color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            max-width: 450px;
            margin: 0 auto;
            padding: 2rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-header img {
            max-width: 150px;
            margin-bottom: 1rem;
        }
        
        .login-header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            font-weight: 600;
        }
        
        .login-form .form-control {
            padding: 0.8rem 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
        }
        
        .login-form .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
            border-color: var(--secondary-color);
        }
        
        .login-btn {
            background-color: var(--secondary-color);
            border: none;
            padding: 0.8rem;
            font-weight: 600;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }
        
        .login-btn:hover, .login-btn:focus {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .user-type-selector {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            gap: 1rem;
        }
        
        .user-type-btn {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background-color: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .user-type-btn.active {
            background-color: var(--secondary-color);
            color: white;
            border-color: var(--secondary-color);
        }
        
        .forgot-password {
            text-align: right;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }
        
        .forgot-password a {
            color: var(--secondary-color);
            text-decoration: none;
        }
        
        .forgot-password a:hover {
            text-decoration: underline;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #6c757d;
        }
        
        .login-footer a {
            color: var(--secondary-color);
            text-decoration: none;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        .form-check-input:checked {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }
        
        @media (max-width: 576px) {
            .login-container {
                margin: 1rem;
                padding: 1.5rem;
            }
            
            .user-type-selector {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .user-type-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="login-container">
            <div class="login-header">
                <img src="/placeholder.svg?height=150&width=150" alt="Logo do Sistema de Formação Profissional" class="img-fluid">
                <h1>Sistema de Formação Profissional</h1>
            </div>
            
            <div class="user-type-selector">
                <button class="user-type-btn active" data-user-type="aluno">
                    <i class="bi bi-mortarboard"></i> Aluno
                </button>
                <button class="user-type-btn" data-user-type="formador">
                    <i class="bi bi-person-workspace"></i> Formador
                </button>
                <button class="user-type-btn" data-user-type="admin">
                    <i class="bi bi-shield-lock"></i> Administrador
                </button>
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Nome de Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="Digite seu nome de usuário" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Digite sua senha" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                Lembrar-me
                            </label>
                        </div>
                    </div>
                    <div class="col">
                        <div class="forgot-password">
                            <a href="#" id="forgotPasswordLink">Esqueceu a senha?</a>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary login-btn">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                </button>
            </form>
            
            <div class="login-footer">
                <p>Não tem uma conta? <a href="#" id="registerLink">Registre-se</a></p>
                <p class="mt-3">&copy; 2023 Sistema de Formação Profissional. Todos os direitos reservados.</p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Toggle password visibility
            const togglePassword = document.getElementById('togglePassword');
            const password = document.getElementById('password');
            
            togglePassword.addEventListener('click', function() {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                this.querySelector('i').classList.toggle('bi-eye');
                this.querySelector('i').classList.toggle('bi-eye-slash');
            });
            
            // User type selector
            const userTypeButtons = document.querySelectorAll('.user-type-btn');
            let currentUserType = 'aluno';
            
            userTypeButtons.forEach(button => {
                button.addEventListener('click', function() {
                    userTypeButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    currentUserType = this.getAttribute('data-user-type');
                });
            });
            
            // Form submission
            const loginForm = document.getElementById('loginForm');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('rememberMe').checked;
                
                // Validate form
                if (!username || !password) {
                    alert('Por favor, preencha todos os campos.');
                    return;
                }
                
                // Redirect based on user type
                // In a real application, you would validate credentials with a server
                console.log(`Login attempt: ${username}, User Type: ${currentUserType}, Remember Me: ${rememberMe}`);
                
                // Simulate redirect
                switch(currentUserType) {
                    case 'aluno':
                        window.location.href = 'formando-dashboard.html';
                        break;
                    case 'formador':
                        window.location.href = 'formador-dashboard.html';
                        break;
                    case 'admin':
                        window.location.href = 'admin-dashboard.html';
                        break;
                }
            });
            
            // Forgot password link
            document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
                e.preventDefault();
                // Show forgot password modal or redirect to forgot password page
                alert('Funcionalidade de recuperação de senha será implementada em breve.');
            });
            
            // Register link
            document.getElementById('registerLink').addEventListener('click', function(e) {
                e.preventDefault();
                // Redirect to registration page based on current user type
                switch(currentUserType) {
                    case 'aluno':
                        window.location.href = 'formando-registro.html';
                        break;
                    case 'formador':
                        window.location.href = 'formador-registro.html';
                        break;
                    default:
                        alert('Apenas alunos e formadores podem se registrar. Contate o administrador para contas administrativas.');
                }
            });
        });
    </script>
</body>
</html>
